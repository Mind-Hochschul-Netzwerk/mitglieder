max_input_vars = 5000
; Obergrenzen für Requests (Mitigation CVE-2026-109618); einziger Upload ist das Profilbild.
; post_max_size war schon bisher mit 8M (php.ini-Standard) die tatsächliche Grenze.
post_max_size = 8M
upload_max_filesize = 7M
memory_limit = 512M

; Mitigations CVE-2026-109619 (nach dem Update auf PHP >= 8.5.12 entbehrlich)
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

[Date]
date.timezone="UTC"
